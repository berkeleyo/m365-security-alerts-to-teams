site_name: M365 Security Alerts → Teams
site_description: Logic App playbook that posts Microsoft 365 / Sentinel alerts to Microsoft Teams (Managed Identity, no webhooks).
repo_url: https://github.com/berkeleyo/m365-security-alerts-to-teams
theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
    - toc.integrate
nav:
  - Overview: index.md
  - Deploy: DEPLOY.md
  - Operate: OPERATE.md
  - Security: SECURITY.md
  - Example Card (JSON): EXAMPLE_CARD.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - codehilite
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/berkeleyo/m365-security-alerts-to-teams
