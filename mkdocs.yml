site_name: M365 Security Alerts to Teams
site_description: Logic Apps and Sentinel playbooks that send Microsoft 365/Sentinel alerts to Microsoft Teams using Managed Identity.
site_url: https://berkeleyo.github.io/m365-security-alerts-to-teams/
repo_name: berkeleyo/m365-security-alerts-to-teams
repo_url: https://github.com/berkeleyo/m365-security-alerts-to-teams

theme:
  name: material
  features:
    - navigation.sections
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: docs/index.md
  - Deploy: docs/DEPLOY.md
  - Operations: docs/OPERATIONS.md
  - Troubleshooting: docs/TROUBLESHOOTING.md
  - FAQ: docs/FAQ.md
